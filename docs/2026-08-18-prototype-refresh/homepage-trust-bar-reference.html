<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gloskin Clinic - Premium Trust Bar</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Palette Gloskin Premium */
            --bg-page: #fdfaf8; 
            --bg-white: #ffffff;
            --text-dark: #2a2a2a;
            --text-muted: #666666; 
            --accent-red: #a81c31; 
            --accent-gold: #c3a378; 
            --border-light: #e8dcd5;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-page);
        }

        /* Simulasi Bagian Bawah Hero Banner (Hanya untuk display) */
        .mock-hero-bottom {
            width: 100%;
            height: 300px;
            background: linear-gradient(135deg, #f8eee9 0%, #e8dcd5 100%);
            position: relative;
        }

        /* --- PREMIUM TRUST BAR SECTION --- */
        .section-trust-bar {
            position: relative;
            z-index: 10;
            margin-top: -60px; /* Overlap ke atas (ke arah hero section) */
            padding: 0 5%;
            margin-bottom: 80px;
        }

        .trust-bar-container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: var(--bg-white);
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.04);
            display: flex;
            align-items: stretch;
            justify-content: space-between;
            padding: 15px;
            /* Border luar super tipis */
            border: 1px solid rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
        }

        /* Irisan Separator Premium (Gradasi Vertikal) */
        .trust-separator {
            width: 1px;
            background: linear-gradient(to bottom, rgba(232, 220, 213, 0) 0%, rgba(232, 220, 213, 1) 50%, rgba(232, 220, 213, 0) 100%);
            margin: 20px 0;
            flex-shrink: 0;
        }

        /* Trust Card Item */
        .trust-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 35px 20px;
            border-radius: 16px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Efek Glow & Hover yang Spektakuler */
        .trust-item::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, rgba(195, 163, 120, 0.08) 0%, rgba(255,255,255,0) 70%);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .trust-item:hover {
            transform: translateY(-8px);
            background-color: #fdfbf9; /* Sedikit warm saat dihover */
            box-shadow: 0 15px 30px rgba(168, 28, 49, 0.04);
        }

        .trust-item:hover::before {
            opacity: 1;
        }

        /* SVG Icon Styling */
        .trust-icon {
            width: 50px;
            height: 50px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-gold);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            z-index: 2;
        }

        .trust-icon svg {
            width: 100%;
            height: 100%;
            stroke: currentColor;
            stroke-width: 1.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all 0.5s ease;
        }

        /* Interaksi Ikon saat Hover */
        .trust-item:hover .trust-icon {
            color: var(--accent-red);
            transform: scale(1.15) translateY(-5px);
        }

        /* Text Styling */
        .trust-text-wrap {
            position: relative;
            z-index: 2;
            transition: transform 0.5s ease;
        }

        .trust-item:hover .trust-text-wrap {
            transform: translateY(-2px);
        }

        .trust-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.15rem;
            color: var(--text-dark);
            margin-bottom: 8px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .trust-desc {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 300;
            line-height: 1.5;
        }

        /* Responsive adjustments */
        @media (max-width: 992px) {
            .trust-bar-container {
                flex-wrap: wrap;
            }
            .trust-item {
                flex: 0 0 48%; /* 2 kolom di tablet */
            }
            .trust-separator:nth-child(2) { display: block; }
            .trust-separator:nth-child(4) { display: none; } /* Hilangkan separator tengah di mode 2 baris */
            .trust-separator:nth-child(6) { display: block; }
        }

        @media (max-width: 600px) {
            .section-trust-bar { margin-top: -30px; }
            .trust-item { flex: 0 0 100%; padding: 25px 20px; }
            .trust-separator { display: none !important; } /* Hilangkan semua separator di mobile (1 kolom) */
            .trust-bar-container { flex-direction: column; padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- Area ini hanya untuk visualisasi posisi hero -->
    <div class="mock-hero-bottom"></div>

    <!-- PREMIUM TRUST BAR SECTION -->
    <section class="section-trust-bar">
        <div class="trust-bar-container">
            
            <!-- Item 1: Dokter Ahli -->
            <div class="trust-item">
                <div class="trust-icon">
                    <!-- SVG: User Doctor/Expert -->
                    <svg viewBox="0 0 24 24">
                        <path d="M12 11c2.21 0 4-1.79 4-4s-1.79-4-4-4 1.79-4 4 1.79 4 4 4z"></path>
                        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                        <path d="M16 12l2 2 4-4"></path>
                    </svg>
                </div>
                <div class="trust-text-wrap">
                    <h4 class="trust-title">Ditangani Ahli</h4>
                    <p class="trust-desc">Dokter bersertifikat & terapis profesional.</p>
                </div>
            </div>

            <div class="trust-separator"></div>

            <!-- Item 2: Evidence Based -->
            <div class="trust-item">
                <div class="trust-icon">
                    <!-- SVG: Shield Check / Aman -->
                    <svg viewBox="0 0 24 24">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                        <path d="M9 12l2 2 4-4"></path>
                    </svg>
                </div>
                <div class="trust-text-wrap">
                    <h4 class="trust-title">Teruji Klinis</h4>
                    <p class="trust-desc">Metode aman berbasis <i>evidence-based</i>.</p>
                </div>
            </div>

            <div class="trust-separator"></div>

            <!-- Item 3: Natural Result -->
            <div class="trust-item">
                <div class="trust-icon">
                    <!-- SVG: Sparkles / Magic -->
                    <svg viewBox="0 0 24 24">
                        <path d="M12 3l1.91 5.8a2 2 0 0 0 1.29 1.29L21 12l-5.8 1.91a2 2 0 0 0-1.29 1.29L12 21l-1.91-5.8a2 2 0 0 0-1.29-1.29L3 12l5.8-1.91a2 2 0 0 0 1.29-1.29L12 3z"></path>
                    </svg>
                </div>
                <div class="trust-text-wrap">
                    <h4 class="trust-title">Hasil Natural</h4>
                    <p class="trust-desc">Meningkatkan kualitas tanpa merubah karakter.</p>
                </div>
            </div>

            <div class="trust-separator"></div>

            <!-- Item 4: Award Winning -->
            <div class="trust-item">
                <div class="trust-icon">
                    <!-- SVG: Certificate / Award -->
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="8" r="6"></circle>
                        <path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"></path>
                    </svg>
                </div>
                <div class="trust-text-wrap">
                    <h4 class="trust-title">Klinik Terpercaya</h4>
                    <p class="trust-desc">Meraih berbagai penghargaan prestisius.</p>
                </div>
            </div>

        </div>
    </section>

</body>
</html>
