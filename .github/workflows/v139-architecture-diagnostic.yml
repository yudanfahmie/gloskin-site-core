name: v0.7.139 Architecture Diagnostic

on:
  push:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  architecture-detail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          coverage: none
      - id: arch
        continue-on-error: true
        shell: bash
        run: |
          set +e
          ./tests/check-architecture.sh > architecture-detail.log 2>&1
          code=$?
          cat architecture-detail.log
          exit "$code"
      - if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const ok='${{ steps.arch.outcome }}'==='success';
            const lines=fs.existsSync('architecture-detail.log')?fs.readFileSync('architecture-detail.log','utf8').split(/\r?\n/).filter(Boolean):[];
            const clean=(line)=>String(line||'unknown').replace(/^.*?plugin\/gloskin-site-core\//,'').replace(/[^A-Za-z0-9._=:/-]+/g,'-').slice(0,76);
            if(ok){
              await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:'success',context:'v139/architecture-detail-pass',description:'PASS: architecture detail'});
            } else {
              const last=clean(lines[lines.length-1]);
              const prev=clean(lines[lines.length-2]);
              await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:'failure',context:`v139/architecture-last/${last||'unknown'}`,description:'Last architecture output line'});
              await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:'failure',context:`v139/architecture-prev/${prev||'unknown'}`,description:'Previous architecture output line'});
            }
