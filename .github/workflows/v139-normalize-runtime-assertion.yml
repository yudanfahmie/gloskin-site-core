name: v0.7.139 Normalize Stale Runtime Assertion

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove stale home clinics assertion only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/runtime-smoke.php')
          src = path.read_text(encoding='utf-8')
          needle = " || count( $context['clinics'] ?? array() ) !== 9"
          if src.count(needle) != 1:
              raise SystemExit(f'expected exactly one stale clinics assertion, found {src.count(needle)}')
          path.write_text(src.replace(needle, '', 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/runtime-smoke.php
          git commit -m 'Align runtime smoke with handoff home context'
          git push origin HEAD:main
