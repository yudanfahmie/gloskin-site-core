name: Correct and Finish Graphik WOFF Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/font-hotfix-correct.yml'

permissions:
  contents: write
  statuses: write

jobs:
  correct-finish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASELINE_HEAD: 88078e1b1a6643204d202374bd11ee6ca3aba750
      UPSTREAM_HEAD: ddd732dd29409153802e37936a365794368c30bf
      FONT_DIR: plugin/gloskin-site-core/assets/fonts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 40

      - name: Guard all concurrent drift as harness-only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = main
          git diff --name-only "$BASELINE_HEAD" HEAD^ | sort -u > /tmp/drift
          while IFS= read -r path; do
            case "$path" in
              tests/v139-harness-baseline-contract.py|.github/workflows/font-hotfix-apply.yml|.github/workflows/font-hotfix-retry.yml|.github/workflows/font-hotfix-final.yml) ;;
              '') ;;
              *) echo "Concurrent production drift not allowed: $path" >&2; exit 1 ;;
            esac
          done < /tmp/drift

      - name: Vendor exact upstream WOFF and apply bounded font patch
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml
          python <<'PY'
          from pathlib import Path
          import os, subprocess, yaml
          wf = yaml.safe_load(Path('.github/workflows/font-hotfix-apply.yml').read_text(encoding='utf-8'))
          steps = {s.get('name'): s for s in wf['jobs']['apply-test-publish']['steps'] if s.get('name')}
          for name in (
              'Fetch upstream outside plugin tree and vendor WOFF only',
              'Patch only font runtime and stale presentation assertions',
              'Add font integrity and Chromium contracts',
              'Verify zero old runtime consumers before deleting WOFF2',
              'Document exact source and SHA-256',
          ):
              print(f'== {name} ==', flush=True)
              subprocess.run(['bash','-c',steps[name]['run']], check=True, env=os.environ.copy())
          PY

      - name: Normalize presentation against exact canonical runtime
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          p = Path('tests/check-presentation.sh')
          src = p.read_text(encoding='utf-8')

          # Preserve existing variant guards. They already exist in the protected
          # runtime; this font pass neither restores nor removes variant behavior.
          if "for selector in (':root',):" in src:
              src = src.replace("for selector in (':root',):", "for selector in (':root', '.gloskin-ui1--modern', '.gloskin-ui1--luxury'):", 1)
          src = src.replace(
              'Graphik/Felix Titling production typography layer missing (typography token regression)',
              'Graphik/Felix production typography layer missing (typography token regression)',
              1,
          )

          stale_sql = r'''if grep -qF '$wpdb' "$adapter" "$template_service"; then
  echo "raw \$wpdb product query found; WooCommerce must remain the sole catalog query owner" >&2
  exit 1
fi
'''
          corrected_sql = r'''# v0.7.138 already owns one bounded TemplateService price-range projection via
# wc_product_meta_lookup. Keep the adapter free of raw DB access and ensure every
# TemplateService $wpdb occurrence stays inside that exact shop_price_bounds().
if grep -qF '$wpdb' "$adapter"; then
  echo "raw \$wpdb product query escaped into the Woo adapter" >&2
  exit 1
fi
shop_price_block="$(awk '/private function shop_price_bounds\(\)/,/^\t\}$/' "$template_service")"
[[ -n "$shop_price_block" ]] || { echo "bounded shop_price_bounds() SQL owner missing" >&2; exit 1; }
template_wpdb_total="$(grep -cF '$wpdb' "$template_service" || true)"
shop_price_wpdb_total="$(printf '%s\n' "$shop_price_block" | grep -cF '$wpdb' || true)"
[[ "$template_wpdb_total" -gt 0 && "$template_wpdb_total" == "$shop_price_wpdb_total" ]] \
  || { echo "TemplateService raw DB access escaped shop_price_bounds()" >&2; exit 1; }
printf '%s\n' "$shop_price_block" | grep -qF "wc_product_meta_lookup" \
  && printf '%s\n' "$shop_price_block" | grep -qF 'SELECT MIN(l.min_price) AS avail_min, MAX(l.max_price) AS avail_max' \
  || { echo "bounded shop price SQL projection changed" >&2; exit 1; }
'''
          if stale_sql in src:
              if src.count(stale_sql) != 1: raise SystemExit('unexpected stale SQL guard multiplicity')
              src = src.replace(stale_sql, corrected_sql, 1)
          elif 'TemplateService raw DB access escaped shop_price_bounds()' not in src:
              raise SystemExit('SQL guard neither known-stale nor normalized')

          stale_base = 'body.woocommerce-cart .wp-block-woocommerce-cart .wp-block-woocommerce-cart-line-items-block .wc-block-cart-items'
          canonical_base = 'body.woocommerce-cart .wp-block-woocommerce-cart table.wc-block-cart-items.wp-block-woocommerce-cart-line-items-block'
          if stale_base in src:
              if src.count(stale_base) != 5:
                  raise SystemExit(f'expected five stale Cart table prefixes, found {src.count(stale_base)}')
              src = src.replace(stale_base, canonical_base)
          for suffix in ('.wc-block-cart-item__total', '.wc-block-components-product-name'):
              stale = 'body.woocommerce-cart .wp-block-woocommerce-cart .wp-block-woocommerce-cart-line-items-block ' + suffix
              canonical = canonical_base + ' ' + suffix
              if stale in src:
                  if src.count(stale) != 1: raise SystemExit(f'unexpected stale Cart selector count for {suffix}')
                  src = src.replace(stale, canonical, 1)
              elif canonical not in src:
                  raise SystemExit(f'Cart selector neither known-stale nor canonical for {suffix}')
          if src.count(canonical_base) < 7:
              raise SystemExit(f'canonical Cart table selector coverage too small: {src.count(canonical_base)}')
          p.write_text(src, encoding='utf-8')

          # v139 disposable normalizer must never reintroduce superseded WOFF2
          # font assertions or an inaccurate Cart selector. After direct
          # normalization, it only verifies these presentation boundaries.
          hpath = Path('tests/v139-harness-baseline-contract.py')
          h = hpath.read_text(encoding='utf-8')
          font_start = h.find("    stale_font_start = 'if [[ ! -f \"$production_css\" ]]'")
          sql_start = h.find('    stale_sql = ', font_start)
          if font_start < 0 or sql_start < 0: raise SystemExit('harness font section boundaries changed')
          h = h[:font_start] + '''    corrected_font_marker = "Graphik/Felix production typography layer missing"\n    if corrected_font_marker not in src:\n        raise SystemExit("check-presentation: canonical Graphik WOFF font contract missing")\n\n''' + h[sql_start:]

          cart_start = h.find('    stale_items_prefix = ')
          if cart_start < 0:
              cart_start = h.find('    stale_cart_prefix = ')
          write_start = h.find('    PRESENTATION.write_text(src, encoding="utf-8")', cart_start)
          if cart_start < 0 or write_start < 0: raise SystemExit('harness Cart section boundaries changed')
          canonical_check = '''    canonical_cart_prefix = "body.woocommerce-cart .wp-block-woocommerce-cart table.wc-block-cart-items.wp-block-woocommerce-cart-line-items-block"\n    if src.count(canonical_cart_prefix) < 7:\n        raise SystemExit("check-presentation: canonical desktop Cart table selector contract missing")\n\n'''
          h = h[:cart_start] + canonical_check + h[write_start:]
          hpath.write_text(h, encoding='utf-8')

          service = Path('plugin/gloskin-site-core/includes/class-gloskin-site-core-asset-service.php')
          s = service.read_text(encoding='utf-8').replace('esc_attr( $type )', '$type', 1)
          service.write_text(s, encoding='utf-8')
          PY

      - name: Font static and PHP contracts
        id: static
        shell: bash
        run: |
          set -euo pipefail
          python tests/font-integrity-contract.py
          php -l plugin/gloskin-site-core/includes/class-gloskin-site-core-asset-service.php
          php -l plugin/gloskin-site-core/includes/class-gloskin-site-core-kernel.php
          php -l plugin/gloskin-site-core/gloskin-site-core.php

      - name: Presentation suite
        id: presentation
        shell: bash
        run: bash tests/check-presentation.sh

      - name: Full runtime suite
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          cp tests/runtime-smoke.php /tmp/runtime-before
          set +e
          bash tests/check-runtime.sh
          code=$?
          set -e
          cp /tmp/runtime-before tests/runtime-smoke.php
          test "$code" -eq 0
          python tests/font-integrity-contract.py

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Chromium font network and render smoke
        id: chromium
        shell: bash
        run: python tests/font-browser-smoke.py

      - name: Final scope guard and direct-main commit
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          start_sha="$(git rev-parse HEAD)"
          rm -f .github/workflows/font-hotfix-apply.yml .github/workflows/font-hotfix-retry.yml .github/workflows/font-hotfix-final.yml .github/workflows/font-hotfix-correct.yml
          cat > /tmp/allowed <<'EOF'
          .github/workflows/font-hotfix-apply.yml
          .github/workflows/font-hotfix-retry.yml
          .github/workflows/font-hotfix-final.yml
          .github/workflows/font-hotfix-correct.yml
          plugin/gloskin-site-core/assets/css/gloskin-ui1-fonts.css
          plugin/gloskin-site-core/assets/fonts/GRAPHIK-SOURCE.md
          plugin/gloskin-site-core/assets/fonts/Graphik-Bold.woff
          plugin/gloskin-site-core/assets/fonts/Graphik-Light.woff
          plugin/gloskin-site-core/assets/fonts/Graphik-Medium.woff
          plugin/gloskin-site-core/assets/fonts/Graphik-Regular.woff
          plugin/gloskin-site-core/assets/fonts/Graphik-Semibold.woff
          plugin/gloskin-site-core/assets/fonts/GraphikBold.woff2
          plugin/gloskin-site-core/assets/fonts/GraphikLight.woff2
          plugin/gloskin-site-core/assets/fonts/GraphikLightItalic.woff2
          plugin/gloskin-site-core/assets/fonts/GraphikMedium.woff2
          plugin/gloskin-site-core/assets/fonts/GraphikMediumItalic.woff2
          plugin/gloskin-site-core/assets/fonts/GraphikRegular.woff2
          plugin/gloskin-site-core/assets/fonts/GraphikRegularItalic.woff2
          plugin/gloskin-site-core/assets/fonts/GraphikSemibold.woff2
          plugin/gloskin-site-core/config/assets.php
          plugin/gloskin-site-core/gloskin-site-core.php
          plugin/gloskin-site-core/includes/class-gloskin-site-core-asset-service.php
          plugin/gloskin-site-core/includes/class-gloskin-site-core-kernel.php
          tests/asset-loading-smoke.php
          tests/check-presentation.sh
          tests/font-browser-smoke.py
          tests/font-integrity-contract.py
          tests/release-version-contract.php
          tests/v139-harness-baseline-contract.py
          EOF
          git diff --name-only "$start_sha" | sort -u > /tmp/actual
          sort -u /tmp/allowed > /tmp/allowed.sorted
          comm -23 /tmp/actual /tmp/allowed.sorted > /tmp/unexpected
          if test -s /tmp/unexpected; then echo 'Unexpected changed paths:' >&2; cat /tmp/unexpected >&2; exit 1; fi
          test -z "$(git diff --name-only "$start_sha" -- plugin/gloskin-site-core/includes/class-gloskin-site-core-revision-20260819-final-migration-admin.php plugin/gloskin-site-core/includes/class-gloskin-site-core-revision-20260819-final-migration.php)"
          python tests/font-integrity-contract.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace Graphik trial WOFF2 with upstream WOFF'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish final statuses
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for spec in \
            'font/static-contracts|PASS: WOFF header/existence/CSS/provenance' \
            'font/presentation|PASS: canonical presentation assertions' \
            'font/runtime|PASS: complete check-runtime.sh' \
            'font/chromium|PASS: HTTP 200/no decode/no OTS/Graphik computed' \
            'v139/full-runtime|PASS: full runtime after font replacement'; do
            context="${spec%%|*}"; description="${spec#*|}"
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$FINAL_SHA" -f state=success -f context="$context" -f description="$description" >/dev/null
          done

      - name: Report correction workflow failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:'failure',context:'font-hotfix/correct-failed',description:'Corrected Graphik WOFF finalizer failed before publish'});
