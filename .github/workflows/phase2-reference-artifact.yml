name: phase2-reference-artifact

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  package-working-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package Phase 2 implementation tree
        uses: actions/upload-artifact@v4
        with:
          name: phase2-slim-tree
          path: |
            plugin/gloskin-site-core
            tests
            .github/workflows/runtime-ci.yml
            docs/client-feedback-developer-priority-phase-1.md
            docs/feedback-cases-gloskin-20260820-154828/FB-989350-home-page
            docs/feedback-cases-gloskin-20260820-154828/FB-989352-promo-page
            docs/feedback-cases-gloskin-20260820-154828/FB-989356-skincare-page
          include-hidden-files: false
          if-no-files-found: error
