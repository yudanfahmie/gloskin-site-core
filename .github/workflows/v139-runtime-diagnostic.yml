name: v0.7.139 Runtime Diagnostic

on:
  push:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  runtime-detail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          coverage: none
      - id: runtime
        continue-on-error: true
        shell: bash
        run: |
          set +e
          GL_TEST_WOO=1 GL_TEST_DIAGNOSTICS=1 php -d auto_prepend_file=tests/runtime-smoke-wordpress-stubs.php tests/runtime-smoke.php > runtime-detail.log 2>&1
          code=$?
          tail -n 50 runtime-detail.log
          exit "$code"
      - if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const ok='${{ steps.runtime.outcome }}'==='success';
            const lines=fs.existsSync('runtime-detail.log')?fs.readFileSync('runtime-detail.log','utf8').split(/\r?\n/).filter(Boolean):[];
            const diag=[...lines].reverse().find(line=>line.startsWith('GL_RUNTIME_CONTEXT ')) || lines[lines.length-1] || 'unknown';
            const slug=diag.replace(/[^A-Za-z0-9._=:-]+/g,'-').slice(0,78);
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:ok?'success':'failure',context:ok?'v139/runtime-detail-pass':`v139/runtime-detail/${slug||'unknown'}`,description:ok?'PASS: runtime detail':'Exact runtime context at failure'});
