name: Bounded Graphik WOFF Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/font-hotfix-apply.yml'

permissions:
  contents: write
  statuses: write

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASELINE_HEAD: 88078e1b1a6643204d202374bd11ee6ca3aba750
      UPSTREAM_HEAD: ddd732dd29409153802e37936a365794368c30bf
      FONT_DIR: plugin/gloskin-site-core/assets/fonts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard exact baseline parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$BASELINE_HEAD"
          test "$(git branch --show-current)" = main

      - name: Fetch upstream outside plugin tree and vendor WOFF only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/opr-bloc
          git clone --quiet https://github.com/opr/bloc.git /tmp/opr-bloc
          git -C /tmp/opr-bloc checkout --quiet "$UPSTREAM_HEAD"
          test "$(git -C /tmp/opr-bloc rev-parse HEAD)" = "$UPSTREAM_HEAD"
          for f in Graphik-Light.woff Graphik-Regular.woff Graphik-Medium.woff Graphik-Semibold.woff Graphik-Bold.woff; do
            test -s "/tmp/opr-bloc/assets/fonts/$f"
            cp "/tmp/opr-bloc/assets/fonts/$f" "$FONT_DIR/$f"
          done
          if find /tmp/opr-bloc/assets/fonts -maxdepth 1 -type f -iname 'Graphik*Italic*' | grep -q .; then
            echo 'Unexpected Graphik italic source appeared upstream; stop for manual review.' >&2
            exit 1
          fi

      - name: Patch only font runtime and stale presentation assertions
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          root = Path('.')
          font_css = root / 'plugin/gloskin-site-core/assets/css/gloskin-ui1-fonts.css'
          font_css.write_text('''/*
           * Gloskin UI v1 self-hosted production fonts.
           *
           * Graphik runtime faces are verbatim WOFF binaries vendored from
           * opr/bloc at commit ddd732dd29409153802e37936a365794368c30bf.
           * See assets/fonts/GRAPHIK-SOURCE.md for source and licensing notes.
           * No runtime request to an external font CDN remains.
           *
           * This file declares only @font-face rules — no other selectors.
           */

          /* Felix Titling — editorial display headings only (400 normal) */
          @font-face{
          \tfont-family:"Felix Titling";
          \tsrc:url("../fonts/Felixti.woff2") format("woff2");
          \tfont-style:normal;
          \tfont-weight:400;
          \tfont-display:swap;
          }

          /* Graphik — one canonical sans-serif family. Upstream provides a genuine
           * Semibold WOFF, so 600 maps to that source rather than a synthesized face. */
          @font-face{
          \tfont-family:"Graphik";
          \tsrc:url("../fonts/Graphik-Light.woff") format("woff");
          \tfont-style:normal;
          \tfont-weight:300;
          \tfont-display:swap;
          }
          @font-face{
          \tfont-family:"Graphik";
          \tsrc:url("../fonts/Graphik-Regular.woff") format("woff");
          \tfont-style:normal;
          \tfont-weight:400;
          \tfont-display:swap;
          }
          @font-face{
          \tfont-family:"Graphik";
          \tsrc:url("../fonts/Graphik-Medium.woff") format("woff");
          \tfont-style:normal;
          \tfont-weight:500;
          \tfont-display:swap;
          }
          @font-face{
          \tfont-family:"Graphik";
          \tsrc:url("../fonts/Graphik-Semibold.woff") format("woff");
          \tfont-style:normal;
          \tfont-weight:600;
          \tfont-display:swap;
          }
          @font-face{
          \tfont-family:"Graphik";
          \tsrc:url("../fonts/Graphik-Bold.woff") format("woff");
          \tfont-style:normal;
          \tfont-weight:700;
          \tfont-display:swap;
          }
          ''', encoding='utf-8')

          def replace_once(path, old, new, label):
              p = root / path
              src = p.read_text(encoding='utf-8')
              if src.count(old) != 1:
                  raise SystemExit(f'{label}: expected exactly one source match, found {src.count(old)}')
              p.write_text(src.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'plugin/gloskin-site-core/config/assets.php',
              """\t\t/* Only the two most-critical faces are preloaded.\n\t\t * GraphikMedium/Semibold/Bold and italic variants are demand-loaded\n\t\t * by the browser on first use — no preload to avoid unused round-trips. */\n\t\t'assets/fonts/GraphikRegular.woff2',\n""",
              """\t\t/* Only the two most-critical faces are preloaded.\n\t\t * Other Graphik weights are demand-loaded by the browser on first use\n\t\t * to avoid unused round-trips. */\n\t\t'assets/fonts/Graphik-Regular.woff',\n""",
              'assets font preload',
          )

          asset_service = root / 'plugin/gloskin-site-core/includes/class-gloskin-site-core-asset-service.php'
          src = asset_service.read_text(encoding='utf-8')
          old_doc = """\t * Preload only the critical self-hosted font files (one Marcellus static\n\t * weight, one Mulish variable-weight instance) declared in\n\t * config/assets.php, and only on the same eligible Gloskin frontend\n"""
          new_doc = """\t * Preload only the critical self-hosted Graphik/Felix font files declared\n\t * in config/assets.php, and only on the same eligible Gloskin frontend\n"""
          if src.count(old_doc) != 1:
              raise SystemExit('AssetService stale font preload doc shape changed')
          src = src.replace(old_doc, new_doc, 1)
          old_loop = """\t\tforeach ( $registry['font_preload'] as $relative ) {\n\t\t\t$url = plugins_url( (string) $relative, $this->plugin_file );\n\t\t\techo '<link rel=\"preload\" href=\"' . esc_url( $url ) . '\" as=\"font\" type=\"font/woff2\" crossorigin>' . \"\\n\";\n\t\t}\n"""
          new_loop = """\t\tforeach ( $registry['font_preload'] as $relative ) {\n\t\t\t$extension = strtolower( pathinfo( (string) $relative, PATHINFO_EXTENSION ) );\n\t\t\t$type      = 'woff' === $extension ? 'font/woff' : ( 'woff2' === $extension ? 'font/woff2' : '' );\n\t\t\tif ( '' === $type ) {\n\t\t\t\tcontinue;\n\t\t\t}\n\t\t\t$url = plugins_url( (string) $relative, $this->plugin_file );\n\t\t\techo '<link rel=\"preload\" href=\"' . esc_url( $url ) . '\" as=\"font\" type=\"' . esc_attr( $type ) . '\" crossorigin>' . \"\\n\";\n\t\t}\n"""
          if src.count(old_loop) != 1:
              raise SystemExit('AssetService font preload loop shape changed')
          asset_service.write_text(src.replace(old_loop, new_loop, 1), encoding='utf-8')

          replace_once(
              'plugin/gloskin-site-core/gloskin-site-core.php',
              ' * Version: 0.7.139', ' * Version: 0.7.140', 'plugin header version')
          replace_once(
              'plugin/gloskin-site-core/includes/class-gloskin-site-core-kernel.php',
              "const VERSION = '0.7.139';", "const VERSION = '0.7.140';", 'kernel version')
          replace_once(
              'tests/release-version-contract.php',
              "$expected = '0.7.139';", "$expected = '0.7.140';", 'release test version')

          presentation = root / 'tests/check-presentation.sh'
          src = presentation.read_text(encoding='utf-8')
          stale_unsplash = """if ! grep -q 'https://images.unsplash.com/photo-' \"$helpers\" \\\n  || grep -Eq 'source\\.unsplash\\.com|images\\.unsplash\\.com/[^p]' \"$helpers\"; then\n  echo \"editorial staging media must use fixed curated Unsplash photo URLs\" >&2\n  exit 1\nfi\n"""
          corrected_unsplash = """# Editorial staging media has no external image dependency in the protected\n# v0.7.139 baseline. The compatibility API remains, but resolves to the\n# deterministic CSS-only presentation fallback instead of Unsplash.\nif grep -Eq 'source\\.unsplash\\.com|https://images\\.unsplash\\.com/' \"$helpers\"; then\n  echo \"editorial staging media must not depend on external Unsplash runtime URLs\" >&2\n  exit 1\nfi\ngrep -Fq 'return array(); /* No external image catalog' \"$helpers\" \\\n  || { echo \"empty editorial media catalog contract missing\" >&2; exit 1; }\ngrep -Fq 'gloskin_ui1_render_presentation_media( $kind, $seed, $class );' \"$helpers\" \\\n  || { echo \"CSS-only editorial presentation fallback missing\" >&2; exit 1; }\n"""
          if src.count(stale_unsplash) != 1:
              raise SystemExit(f'presentation Unsplash stale block count={src.count(stale_unsplash)}')
          src = src.replace(stale_unsplash, corrected_unsplash, 1)
          old_selector = "for selector in (':root', '.gloskin-ui1--modern', '.gloskin-ui1--luxury'):"
          if src.count(old_selector) != 1:
              raise SystemExit('presentation legacy variant selector shape changed')
          src = src.replace(old_selector, "for selector in (':root',):", 1)
          src = src.replace("('luxury body text', '#FBFBFA', '#2A232C', 7.0),", "('inverse body text', '#FBFBFA', '#2A232C', 7.0),", 1)
          old_typography = """if [[ ! -f \"$production_css\" ]] \\\n  || ! grep -q -- '--gloskin-font-body:\"Mulish\"' \"$production_css\" \\\n  || ! grep -q -- '--gloskin-font-heading:\"Marcellus\"' \"$production_css\"; then\n  echo \"Marcellus/Mulish production typography layer missing (typography token regression)\" >&2\n  exit 1\nfi\n"""
          new_typography = """if [[ ! -f \"$production_css\" ]] \\\n  || ! grep -q -- '--gloskin-font-body:\"Graphik\"' \"$production_css\" \\\n  || ! grep -q -- '--gloskin-font-heading:\"Felix Titling\"' \"$production_css\"; then\n  echo \"Graphik/Felix Titling production typography layer missing (typography token regression)\" >&2\n  exit 1\nfi\n"""
          if src.count(old_typography) != 1:
              raise SystemExit('presentation stale typography block shape changed')
          src = src.replace(old_typography, new_typography, 1)
          start = src.find('# Gloskin self-hosted production fonts: no runtime Google Fonts CDN')
          end = src.find('# Font assets never load in WP Admin:', start)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('presentation stale font contract block markers changed')
          new_font_contract = """# Gloskin self-hosted production fonts: canonical Graphik WOFF plus unchanged\n# Felix Titling WOFF2, with no external Google Fonts runtime dependency.\nfonts_css=\"$plugin_root/assets/css/gloskin-ui1-fonts.css\"\nif grep -qE 'fonts\\.googleapis\\.com|fonts\\.gstatic\\.com' \"$plugin_root/config/assets.php\" \"$fonts_css\"; then\n  echo \"font runtime still references the Google Fonts CDN\" >&2\n  exit 1\nfi\nif ! grep -qF \"'assets/css/gloskin-ui1-fonts.css'\" \"$plugin_root/config/assets.php\"; then\n  echo \"gloskin-ui1-fonts registry entry no longer points at the local font stylesheet\" >&2\n  exit 1\nfi\npython \"$repo_root/tests/font-integrity-contract.py\"\n\n"""
          src = src[:start] + new_font_contract + src[end:]
          presentation.write_text(src, encoding='utf-8')

          asset_test = root / 'tests/asset-loading-smoke.php'
          src = asset_test.read_text(encoding='utf-8')
          src = src.replace(
              '/* Graphik/Felix Titling era (v0.7.132): only the two critical owner-supplied\n * faces are preloaded; Marcellus and Mulish are retired. */',
              '/* Canonical Graphik/Felix Titling runtime: only the two critical faces\n * are preloaded; other Graphik weights remain demand-loaded. */',
              1,
          )
          old_expected = "foreach ( array( 'GraphikRegular.woff2', 'Felixti.woff2' ) as $expected_file ) {"
          if src.count(old_expected) != 1:
              raise SystemExit('asset-loading expected preload list shape changed')
          src = src.replace(old_expected, "foreach ( array( 'Graphik-Regular.woff', 'Felixti.woff2' ) as $expected_file ) {", 1)
          old_mime = """if ( false === strpos( $preload, 'as=\"font\"' ) || false === strpos( $preload, 'type=\"font/woff2\"' ) || false === strpos( $preload, 'crossorigin' ) ) {\n\tfwrite( STDERR, \"font preload missing required as/type/crossorigin attributes: {$preload}\\n\" ); exit( 1 );\n}\n"""
          new_mime = """if ( false === strpos( $preload, 'as=\"font\"' ) || false === strpos( $preload, 'type=\"font/woff\"' ) || false === strpos( $preload, 'type=\"font/woff2\"' ) || false === strpos( $preload, 'crossorigin' ) ) {\n\tfwrite( STDERR, \"font preload missing required WOFF/WOFF2 as/type/crossorigin attributes: {$preload}\\n\" ); exit( 1 );\n}\n"""
          if src.count(old_mime) != 1:
              raise SystemExit('asset-loading preload MIME assertion shape changed')
          asset_test.write_text(src.replace(old_mime, new_mime, 1), encoding='utf-8')
          PY

      - name: Add font integrity and Chromium contracts
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/font-integrity-contract.py <<'PY'
          #!/usr/bin/env python3
          from pathlib import Path
          import hashlib
          import re
          import struct

          ROOT = Path(__file__).resolve().parents[1]
          PLUGIN = ROOT / 'plugin/gloskin-site-core'
          CSS = PLUGIN / 'assets/css/gloskin-ui1-fonts.css'
          FONT_DIR = PLUGIN / 'assets/fonts'
          CONFIG = PLUGIN / 'config/assets.php'
          EXPECTED = {
              300: 'Graphik-Light.woff',
              400: 'Graphik-Regular.woff',
              500: 'Graphik-Medium.woff',
              600: 'Graphik-Semibold.woff',
              700: 'Graphik-Bold.woff',
          }

          css = CSS.read_text(encoding='utf-8')
          blocks = re.findall(r'@font-face\s*\{([^}]*)\}', css, flags=re.S)
          graphik = []
          felix = []
          for block in blocks:
              fam = re.search(r'font-family:\s*"([^"]+)"', block)
              if not fam:
                  continue
              if fam.group(1) == 'Graphik':
                  graphik.append(block)
              elif fam.group(1) == 'Felix Titling':
                  felix.append(block)

          if len(graphik) != 5:
              raise SystemExit(f'expected exactly five Graphik normal faces, found {len(graphik)}')
          seen = {}
          for block in graphik:
              weight = re.search(r'font-weight:\s*(\d+)', block)
              src = re.search(r'url\("\.\./fonts/([^"?]+)"\)\s*format\("([^"]+)"\)', block)
              if not weight or not src:
                  raise SystemExit('Graphik @font-face missing weight/src/format')
              weight = int(weight.group(1))
              filename, fmt = src.groups()
              if fmt != 'woff':
                  raise SystemExit(f'Graphik {weight} is not format("woff")')
              if 'font-style:normal' not in block or 'font-display:swap' not in block:
                  raise SystemExit(f'Graphik {weight} style/display policy regressed')
              seen[weight] = filename
          if seen != EXPECTED:
              raise SystemExit(f'Graphik weight mapping mismatch: {seen!r}')
          if re.search(r'font-family:\s*"Graphik"[^}]*font-style:\s*(italic|oblique)', css, flags=re.S | re.I):
              raise SystemExit('custom Graphik italic/oblique face must not be declared without upstream binary')

          if len(felix) != 1:
              raise SystemExit('Felix Titling face count changed')
          f = felix[0]
          for exact in ('url("../fonts/Felixti.woff2") format("woff2")', 'font-style:normal', 'font-weight:400', 'font-display:swap'):
              if exact not in f:
                  raise SystemExit(f'Felix Titling declaration changed: missing {exact}')

          for match in re.finditer(r'url\("\.\./fonts/([^"?]+)"\)', css):
              filename = match.group(1)
              if not (FONT_DIR / filename).is_file():
                  raise SystemExit(f'CSS references missing font file: {filename}')

          header_fmt = '>4s4sIHHIHHIIIII'
          header_size = struct.calcsize(header_fmt)
          for weight, filename in EXPECTED.items():
              path = FONT_DIR / filename
              data = path.read_bytes()
              if len(data) < header_size:
                  raise SystemExit(f'{filename}: shorter than WOFF header')
              sig, flavor, declared_len, num_tables, reserved, total_sfnt, major, minor, meta_off, meta_len, meta_orig, priv_off, priv_len = struct.unpack(header_fmt, data[:header_size])
              if sig != b'wOFF':
                  raise SystemExit(f'{filename}: invalid WOFF magic {sig!r}')
              if declared_len != len(data):
                  raise SystemExit(f'{filename}: WOFF length header {declared_len} != {len(data)}')
              if num_tables < 1 or reserved != 0 or total_sfnt < 12 + (16 * num_tables):
                  raise SystemExit(f'{filename}: invalid WOFF structural header')
              print(f'{filename} sha256={hashlib.sha256(data).hexdigest()} flavor={flavor.decode("latin1")} tables={num_tables}')

          leftovers = sorted(p.name for p in FONT_DIR.glob('Graphik*.woff2'))
          if leftovers:
              raise SystemExit(f'superseded Graphik WOFF2 files remain: {leftovers}')
          forbidden_binary = sorted(p.name for p in FONT_DIR.iterdir() if p.is_file() and p.name.startswith('Graphik') and p.suffix.lower() in {'.otf', '.ttf', '.eot'})
          if forbidden_binary:
              raise SystemExit(f'non-WOFF Graphik binaries were copied into runtime: {forbidden_binary}')

          runtime_text = ''
          for path in PLUGIN.rglob('*'):
              if path.is_file() and path.suffix.lower() in {'.php', '.css', '.js', '.json', '.md'}:
                  runtime_text += '\n' + path.read_text(encoding='utf-8', errors='ignore')
          if re.search(r'Graphik[^\s"\']*\.woff2', runtime_text, flags=re.I):
              raise SystemExit('production plugin still contains a Graphik WOFF2 consumer/reference')

          config = CONFIG.read_text(encoding='utf-8')
          if "'assets/fonts/Graphik-Regular.woff'" not in config or 'GraphikRegular.woff2' in config:
              raise SystemExit('critical Graphik preload is not the canonical Regular WOFF')

          conversion_terms = re.compile(r'graphik-trial\.zip|woff2_compress|otf2woff2|fontforge|pyftsubset|fonttools\.ttlib', re.I)
          offenders = []
          for base in (PLUGIN, ROOT / 'tests', ROOT / '.github'):
              if not base.exists():
                  continue
              for path in base.rglob('*'):
                  if not path.is_file() or path == Path(__file__).resolve() or path.name == 'font-hotfix-apply.yml':
                      continue
                  if path.suffix.lower() not in {'.py', '.sh', '.php', '.js', '.yml', '.yaml'}:
                      continue
                  text = path.read_text(encoding='utf-8', errors='ignore')
                  if conversion_terms.search(text):
                      offenders.append(str(path.relative_to(ROOT)))
          if offenders:
              raise SystemExit(f'Graphik OTF->WOFF2 conversion pipeline/tool reference remains active: {offenders}')

          print('font-integrity-contract: OK')
          PY

          cat > tests/font-browser-smoke.py <<'PY'
          #!/usr/bin/env python3
          from pathlib import Path
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          import json
          import shutil
          import threading
          from playwright.sync_api import sync_playwright

          ROOT = Path(__file__).resolve().parents[1]
          EXPECTED = {
              'Graphik-Light.woff',
              'Graphik-Regular.woff',
              'Graphik-Medium.woff',
              'Graphik-Semibold.woff',
              'Graphik-Bold.woff',
          }
          HTML = b'''<!doctype html><html><head><meta charset="utf-8">
          <link rel="stylesheet" href="/plugin/gloskin-site-core/assets/css/gloskin-ui1-fonts.css">
          <style>
          body,nav,button,.sample{font-family:"Graphik",sans-serif}
          body{font-weight:400} nav{font-weight:500} button{font-weight:700}
          </style></head><body><nav id="nav">Navigation</nav><button id="button">Button</button>
          <span class="sample" style="font-weight:300">Light sample</span>
          <span class="sample" style="font-weight:400">Regular sample</span>
          <span class="sample" style="font-weight:500">Medium sample</span>
          <span class="sample" style="font-weight:600">Semibold sample</span>
          <span class="sample" style="font-weight:700">Bold sample</span>
          </body></html>'''

          class Handler(SimpleHTTPRequestHandler):
              def __init__(self, *args, **kwargs):
                  super().__init__(*args, directory=str(ROOT), **kwargs)
              def log_message(self, fmt, *args):
                  pass
              def do_GET(self):
                  if self.path == '/__graphik_font_fixture__.html':
                      self.send_response(200)
                      self.send_header('Content-Type', 'text/html; charset=utf-8')
                      self.send_header('Content-Length', str(len(HTML)))
                      self.end_headers()
                      self.wfile.write(HTML)
                      return
                  super().do_GET()

          server = ThreadingHTTPServer(('127.0.0.1', 0), Handler)
          thread = threading.Thread(target=server.serve_forever, daemon=True)
          thread.start()
          url = f'http://127.0.0.1:{server.server_port}/__graphik_font_fixture__.html'

          failures = []
          console_errors = []
          font_responses = {}
          try:
              with sync_playwright() as p:
                  launch_args = {'headless': True}
                  system_chromium = shutil.which('chromium') or shutil.which('chromium-browser')
                  if system_chromium:
                      launch_args['executable_path'] = system_chromium
                  browser = p.chromium.launch(**launch_args)
                  page = browser.new_page()
                  page.on('requestfailed', lambda req: failures.append((req.url, req.failure)))
                  page.on('console', lambda msg: console_errors.append(msg.text) if msg.type == 'error' else None)
                  def capture(resp):
                      if resp.url.lower().endswith(('.woff', '.woff2')):
                          font_responses[resp.url.rsplit('/', 1)[-1]] = resp.status
                  page.on('response', capture)
                  page.goto(url, wait_until='networkidle')
                  result = page.evaluate('''async () => {
                    const weights=[300,400,500,600,700];
                    for (const w of weights) await document.fonts.load(`${w} 18px Graphik`, 'Graphik');
                    await document.fonts.ready;
                    const first = el => getComputedStyle(el).fontFamily.split(',')[0].replace(/["']/g,'').trim();
                    return {
                      status: document.fonts.status,
                      checks: Object.fromEntries(weights.map(w => [w, document.fonts.check(`${w} 18px Graphik`, 'Graphik')])),
                      families: {
                        body:first(document.body), nav:first(document.getElementById('nav')), button:first(document.getElementById('button'))
                      }
                    };
                  }''')
                  page.wait_for_timeout(300)
                  browser.close()
          finally:
              server.shutdown()
              server.server_close()

          if result['status'] != 'loaded' or not all(result['checks'].values()):
              raise SystemExit(f'Graphik FontFaceSet did not load all target weights: {result}')
          if any(v != 'Graphik' for v in result['families'].values()):
              raise SystemExit(f'computed representative font-family is not Graphik: {result["families"]}')
          missing = EXPECTED.difference(font_responses)
          bad = {name: status for name, status in font_responses.items() if name in EXPECTED and status != 200}
          if missing or bad:
              raise SystemExit(f'Graphik network contract failed: missing={sorted(missing)} bad={bad} responses={font_responses}')
          graphik_failures = [item for item in failures if 'Graphik' in item[0] or item[0].lower().endswith(('.woff','.woff2'))]
          if graphik_failures:
              raise SystemExit(f'font request failures: {graphik_failures}')
          decode_errors = [msg for msg in console_errors if any(term in msg.lower() for term in ('failed to decode downloaded font', 'ots parsing error', 'font decode', 'font parsing'))]
          if decode_errors:
              raise SystemExit(f'Chromium font decode/OTS errors: {decode_errors}')
          if any(name.startswith('Graphik') and name.endswith('.woff2') for name in font_responses):
              raise SystemExit(f'superseded Graphik WOFF2 requested: {font_responses}')
          print('font-browser-smoke: OK')
          print(json.dumps({'families': result['families'], 'checks': result['checks'], 'font_responses': font_responses}, sort_keys=True))
          PY

      - name: Verify zero old runtime consumers before deleting WOFF2
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'Graphik(Light|Regular|Medium|Semibold|Bold|LightItalic|RegularItalic|MediumItalic)\.woff2' plugin/gloskin-site-core \
            --include='*.php' --include='*.css' --include='*.js' --include='*.json' --include='*.md'; then
            echo 'superseded Graphik WOFF2 still has a production consumer/reference' >&2
            exit 1
          fi
          rm -f "$FONT_DIR"/Graphik*.woff2

      - name: Document exact source and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# Graphik runtime source provenance'
            echo
            echo '- Upstream repository: `opr/bloc`.'
            echo "- Upstream commit: \`$UPSTREAM_HEAD\`."
            echo '- Vendored format: original WOFF binaries copied verbatim; no WOFF2 conversion performed.'
            echo '- Runtime files:'
            for f in Graphik-Light.woff Graphik-Regular.woff Graphik-Medium.woff Graphik-Semibold.woff Graphik-Bold.woff; do
              printf '  - `%s` — SHA-256 `%s`\n' "$f" "$(sha256sum "$FONT_DIR/$f" | awk '{print $1}')"
            done
            echo
            echo '## Licensing note'
            echo
            echo 'The upstream repository carries an MIT license for the repository project. That fact does **not** by itself establish, transfer, or grant a Graphik typeface/font license. Rights for public or commercial deployment of these Graphik font binaries must be verified independently with the appropriate rights holder/license terms before such use.'
          } > "$FONT_DIR/GRAPHIK-SOURCE.md"

      - name: Static font integrity contract
        id: static
        shell: bash
        run: |
          set -euo pipefail
          python tests/font-integrity-contract.py
          php -l plugin/gloskin-site-core/includes/class-gloskin-site-core-asset-service.php
          php -l plugin/gloskin-site-core/includes/class-gloskin-site-core-kernel.php
          php -l plugin/gloskin-site-core/gloskin-site-core.php

      - name: Presentation suite
        id: presentation
        shell: bash
        run: bash tests/check-presentation.sh

      - name: Complete runtime suite
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          cp tests/runtime-smoke.php /tmp/runtime-smoke.php.before-font-suite
          bash tests/check-runtime.sh
          cmp -s tests/runtime-smoke.php /tmp/runtime-smoke.php.before-font-suite || cp /tmp/runtime-smoke.php.before-font-suite tests/runtime-smoke.php
          python tests/font-integrity-contract.py

      - name: Install Chromium for dedicated font smoke
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Chromium font render/load smoke
        id: chromium
        shell: bash
        run: python tests/font-browser-smoke.py

      - name: Scope guard and final commit
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/font-hotfix-apply.yml
          cat > /tmp/allowed-font-hotfix-paths <<'EOF'
          plugin/gloskin-site-core/assets/css/gloskin-ui1-fonts.css
          plugin/gloskin-site-core/assets/fonts/GRAPHIK-SOURCE.md
          plugin/gloskin-site-core/assets/fonts/Graphik-Bold.woff
          plugin/gloskin-site-core/assets/fonts/Graphik-Light.woff
          plugin/gloskin-site-core/assets/fonts/Graphik-Medium.woff
          plugin/gloskin-site-core/assets/fonts/Graphik-Regular.woff
          plugin/gloskin-site-core/assets/fonts/Graphik-Semibold.woff
          plugin/gloskin-site-core/assets/fonts/GraphikBold.woff2
          plugin/gloskin-site-core/assets/fonts/GraphikLight.woff2
          plugin/gloskin-site-core/assets/fonts/GraphikLightItalic.woff2
          plugin/gloskin-site-core/assets/fonts/GraphikMedium.woff2
          plugin/gloskin-site-core/assets/fonts/GraphikMediumItalic.woff2
          plugin/gloskin-site-core/assets/fonts/GraphikRegular.woff2
          plugin/gloskin-site-core/assets/fonts/GraphikRegularItalic.woff2
          plugin/gloskin-site-core/assets/fonts/GraphikSemibold.woff2
          plugin/gloskin-site-core/config/assets.php
          plugin/gloskin-site-core/gloskin-site-core.php
          plugin/gloskin-site-core/includes/class-gloskin-site-core-asset-service.php
          plugin/gloskin-site-core/includes/class-gloskin-site-core-kernel.php
          tests/asset-loading-smoke.php
          tests/check-presentation.sh
          tests/font-browser-smoke.py
          tests/font-integrity-contract.py
          tests/release-version-contract.php
          EOF
          git diff --name-only "$BASELINE_HEAD" -- . ':(exclude).github/workflows/font-hotfix-apply.yml' | sort -u > /tmp/actual-font-hotfix-paths
          sort -u /tmp/allowed-font-hotfix-paths > /tmp/allowed-font-hotfix-paths.sorted
          comm -23 /tmp/actual-font-hotfix-paths /tmp/allowed-font-hotfix-paths.sorted > /tmp/unexpected-font-hotfix-paths
          if test -s /tmp/unexpected-font-hotfix-paths; then
            echo 'Unexpected changed paths:' >&2
            cat /tmp/unexpected-font-hotfix-paths >&2
            exit 1
          fi
          if grep -RInE 'Graphik[^[:space:]"'"']*\.woff2' plugin/gloskin-site-core --include='*.php' --include='*.css' --include='*.js' --include='*.md'; then
            echo 'Graphik WOFF2 runtime reference remains at final scope guard' >&2
            exit 1
          fi
          test -z "$(git diff --name-only "$BASELINE_HEAD" -- plugin/gloskin-site-core/includes/class-gloskin-site-core-revision-20260819-final-migration-admin.php plugin/gloskin-site-core/includes/class-gloskin-site-core-revision-20260819-final-migration.php)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace Graphik trial WOFF2 with upstream WOFF'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish final commit statuses
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for spec in \
            'font/static-contracts|PASS: WOFF existence/header/CSS/provenance' \
            'font/presentation|PASS: presentation assertions normalized' \
            'font/runtime|PASS: complete tests/check-runtime.sh' \
            'font/chromium|PASS: HTTP 200 + Graphik render/decode smoke' \
            'v139/full-runtime|PASS: complete runtime after font hotfix'; do
            context="${spec%%|*}"
            description="${spec#*|}"
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$FINAL_SHA" \
              -f state=success -f context="$context" -f description="$description" >/dev/null
          done

      - name: Report bootstrap failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:'failure',context:'font-hotfix/apply-failed',description:'Bounded Graphik WOFF hotfix workflow failed before final publish'});
