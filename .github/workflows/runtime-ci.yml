name: runtime-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime-check:
    name: Runtime smoke & presentation contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: gd, mbstring, intl
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Report stale release literals
        run: grep -RIn --exclude='*.md' '0\.7\.142' tests || true

      - name: Install Playwright Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install chromium

      - name: Run check-runtime.sh (read-only, including browser smoke)
        run: bash tests/check-runtime.sh

      - name: Verify working tree is clean after tests
        run: |
          git diff --exit-code || {
            echo "FAIL: test run left tracked files modified — tests must be read-only" >&2
            exit 1
          }
          if [ -n "$(git status --porcelain)" ]; then
            echo "FAIL: git status not clean after test run" >&2
            git status --porcelain >&2
            exit 1
          fi
          echo "Working tree is clean — immutability contract satisfied"

      - name: Report browser environment
        run: |
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          pw = sync_playwright().start()
          executable = Path(pw.chromium.executable_path)
          print(f"Playwright Chromium executable: {executable}")
          print(f"Playwright Chromium available: {executable.is_file()}")
          pw.stop()
          if not executable.is_file():
              raise SystemExit(1)
          PY
          echo "Browser suites executed through tests/check-runtime.sh"
